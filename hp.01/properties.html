<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 매물 정보 | 둥지부동산중개법인</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script src="public-display.js"></script>
</head>

<body>
    <header id="header" class="scrolled">
        <div class="container">
            <!-- 로고 (인라인 절대배치 제거, CSS Flexbox에서 제어) -->
            <a href="index.html" class="logo" style="text-decoration: none;">(주)둥지부동산중개법인</a>
            
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html#home">홈</a></li>
                    <li><a href="about.html">법인소개</a></li>
                    <li><a href="properties.html" class="active" style="color: var(--accent-color); font-weight: 700;">매물정보</a></li>
                    <li><a href="map.html">지도보기</a></li>
                    <li><a href="index.html#submit-property">매물내놓기</a></li>
                    <li><a href="guide.html">임대차 가이드</a></li>
                    <li><a href="corporate.html">기업서비스</a></li>
                    <li><a href="recruit.html">인재모집</a></li>
                    <li><a href="https://www.doongji.co.kr/" target="_blank">건물관리서비스</a></li>
                    <li><a href="index.html#contact" class="btn-consult">상담문의</a></li>
                </ul>
            </nav>
            
            <!-- 데스크톱용 맨 오른쪽 정렬 관리자 로그인 -->
            <a href="admin.html" class="btn-admin-nav desktop-only" style="border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 4px; font-size: 12.5px; color: rgba(255, 255, 255, 0.45); text-decoration: none; transition: all 0.3s; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; background: transparent; white-space: nowrap;"
               onmouseenter="this.style.borderColor='var(--accent-color)'; this.style.color='var(--accent-color)'; this.querySelector('i').style.opacity='1';" 
               onmouseleave="this.style.borderColor='rgba(255, 255, 255, 0.15)'; this.style.color='rgba(255, 255, 255, 0.45)'; this.querySelector('i').style.opacity='0.5';">
                <i class="fas fa-lock" style="font-size: 10.5px; color: var(--accent-color); opacity: 0.5; transition: opacity 0.3s;"></i> 관리자 로그인
            </a>

            <div class="menu-toggle" id="mobile-menu">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Filter Header -->
    <div class="properties-filter-header">
        <select id="filterRegion" onchange="applyFilters()">
            <option value="">전체지역</option>
            <option value="서울">서울</option>
            <option value="경기">경기</option>
        </select>
        <select id="filterType" onchange="applyFilters()">
            <option value="">매물종류</option>
            <option value="사무실">사무실</option>
            <option value="상가">상가</option>
            <option value="빌딩">빌딩</option>
            <option value="토지">토지</option>
            <option value="주거용">주거용</option><option value="주택">주택</option><option value="오피스텔">오피스텔</option><option value="아파트">아파트</option>
        </select>
        <select id="filterFloor" onchange="applyFilters()">
            <option value="">층수</option>
        </select>
        <span style="font-size: 13px; color: #64748b; font-weight: 500;" id="filterCount">검색된 매물: 0개</span>
        
        <!-- Admin Login Button -->
        <a href="admin.html" class="btn-admin-link" 
           style="margin-left: auto; text-decoration: none; font-size: 12px; color: #64748b; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 50px; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; background: var(--white); box-shadow: 0 2px 5px rgba(0,0,0,0.05);"
           onmouseenter="this.style.borderColor='var(--accent-color)'; this.style.color='var(--primary-color)'; this.style.boxShadow='0 2px 8px rgba(197, 160, 89, 0.25)';" 
           onmouseleave="this.style.borderColor='var(--border-color)'; this.style.color='#64748b'; this.style.boxShadow='0 2px 5px rgba(0,0,0,0.05)';">
            <i class="fas fa-lock" style="font-size: 10px; color: var(--accent-color);"></i> 관리자 로그인
        </a>
    </div>

    <!-- Main Full Width Container -->
    <section class="container" style="margin-top: 150px; padding-bottom: 80px; min-height: calc(100vh - 250px);">
        <div class="section-header" style="margin-bottom: 45px; text-align: center;">
            <h2 style="font-size: 2.5rem; margin-bottom: 0; color: var(--primary-color); font-family: 'Playfair Display', serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">RENTAL LISTINGS</h2>
        </div>
        
        <div class="property-grid" id="propertiesGrid">
            <!-- Dynamic Content Loaded from localStorage -->
        </div>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 50px; margin-bottom: 30px;">
            <a href="map.html" class="btn-consult" style="padding: 12px 40px; font-size: 15px; text-decoration: none; background: var(--accent-color); color: var(--primary-color) !important; border-color: var(--accent-color); font-weight: 700;">지도보기</a>
            <a href="index.html" class="btn-consult" style="padding: 12px 30px; font-size: 15px; text-decoration: none;">메인 페이지로 돌아가기</a>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 doongji Real Estate Corp. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Mobile Menu Toggle
        const menuToggle = document.getElementById('mobile-menu');
        const navList = document.querySelector('.nav-list');

        menuToggle.addEventListener('click', () => {
            navList.classList.toggle('active');
        });

        // Dynamic Loading from localStorage
        function getProperties() {
            let props = localStorage.getItem('nest_properties');
            // Fallback default properties (Gangnam Datasets)
            const defaultProperties = [
                {
                    id: "prop-1",
                    tag: "서울",
                    type: "사무실",
                    floor: "5층",
                    title: "역삼역 초역세권 대형 프라임 오피스",
                    desc: "전용 150평 / 테헤란로 뷰 / 고층 오피스 빌딩 내 지상 5층",
                    price: "보증금 5억 / 월 4,500만",
                    imageUrl: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=800",
                    lat: 37.5019,
                    lng: 127.0374
                },
                {
                    id: "prop-2",
                    tag: "서울",
                    type: "상가",
                    floor: "1층",
                    title: "청담동 명품거리 1층 로드샵 상가",
                    desc: "전용 80평 / 쇼룸 완비 / 1층 테라스 활용 가능",
                    price: "가격 협의",
                    imageUrl: "https://images.unsplash.com/photo-1554469384-e58fac16e23a?auto=format&fit=crop&q=80&w=800",
                    lat: 37.5251,
                    lng: 127.0435
                },
                {
                    id: "prop-3",
                    tag: "경기",
                    type: "토지",
                    floor: "1층",
                    title: "용인 기흥 상업용 개발 토지 매매",
                    desc: "토지면적 450평 / 대로변 코너 / 근생 및 물류 부지 추천",
                    price: "매매 45억",
                    imageUrl: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&q=80&w=800",
                    lat: 37.2804,
                    lng: 127.1179
                },
                {
                    id: "prop-4",
                    tag: "서울",
                    type: "상가",
                    floor: "-1층",
                    title: "강남역 인근 지하 대형 F&B 상가",
                    desc: "전용 120평 / 지하 1층 단독 진입 계단 / 주방 설비 완비 및 층고 4m",
                    price: "보증금 2억 / 월 1,500만",
                    imageUrl: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&q=80&w=800",
                    lat: 37.4979,
                    lng: 127.0276
                },
                {
                    id: "prop-5",
                    tag: "경기",
                    type: "주거용",
                    floor: "12층",
                    title: "분당 정자동 오피스텔 주거용 풀옵션",
                    desc: "전용 24평 / 지상 12층 탄천 뷰 / 침실 2개 / 즉시 입주 가능",
                    price: "보증금 3,000만 / 월 180만",
                    imageUrl: "https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&q=80&w=800",
                    lat: 37.3614,
                    lng: 127.1086
                },
                {
                    id: "prop-6",
                    tag: "서울",
                    type: "빌딩",
                    floor: "7층",
                    title: "테헤란로 삼성동 대로변 프라임 사옥 빌딩",
                    desc: "연면적 450평 / 지상 7층 전체 통임대 / 자주식 주차 10대",
                    price: "보증금 8억 / 월 6,000만",
                    imageUrl: "https://images.unsplash.com/photo-1577495508048-b635879837f1?auto=format&fit=crop&q=80&w=800",
                    lat: 37.5097,
                    lng: 127.0620
                }
            ];

            if (props === null) {
                localStorage.setItem('nest_properties', JSON.stringify(defaultProperties));
                return defaultProperties;
            }
            try {
                return JSON.parse(props) || [];
            } catch (e) {
                console.error("Failed to parse nest_properties in properties page:", e);
                return [];
            }
        }

        const propertiesGrid = document.getElementById('propertiesGrid');

        function renderAllProperties(customProps) {
            const props = customProps || getProperties();
            propertiesGrid.innerHTML = '';
            
            if (props.length === 0) {
                propertiesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">조건에 맞는 매물이 없습니다.</p>';
                return;
            }

            props.forEach(p => {
                const card = document.createElement('div');
                card.className = 'property-card';
                card.id = `card-${p.id}`;
                card.innerHTML = `
                    <div class="card-image" style="background-image: url('${p.imageUrl}'); cursor: pointer;" onclick="openPremiumDetailModal('${p.id}')">
                        <span class="tag" style="background: var(--accent-color);">${escapeHtml(p.tag)} | ${escapeHtml(p.floor && p.floor.startsWith('-') ? '지하 ' + p.floor.substring(1) : p.floor)}</span>
                    </div>
                    <div class="card-body">
                        <h3 style="cursor: pointer;" onclick="openPremiumDetailModal('${p.id}')">${escapeHtml(NestPublic.title(p))}</h3>
                        <p class="desc">${escapeHtml(p.desc)}</p>
                        <div class="card-footer">
                            <span class="price">${escapeHtml(p.price)}</span>
                             <button class="btn-text" onclick="openPremiumDetailModal('${p.id}')">자세히 보기 &rarr;</button>
                        </div>
                    </div>
                `;
                propertiesGrid.appendChild(card);
            });
        }

        // Filtering logic
        function applyFilters() {
            const selectedRegion = document.getElementById('filterRegion').value;
            const selectedType = document.getElementById('filterType').value;
            const selectedFloor = document.getElementById('filterFloor').value;
            const allProps = getProperties();

            const filtered = allProps.filter(p => {
                const regionMatch = !selectedRegion || p.tag === selectedRegion;
                const typeMatch = !selectedType || p.type === selectedType;
                const floorMatch = !selectedFloor || p.floor === selectedFloor;
                return regionMatch && typeMatch && floorMatch;
            });

            // Update count display
            document.getElementById('filterCount').innerText = `검색된 매물: ${filtered.length}개`;

            // Render filtered properties
            renderAllProperties(filtered);
        }

        // URL query parameter parsing
        function parseUrlParameters() {
            const params = new URLSearchParams(window.location.search);
            const regionParam = params.get('region');
            const typeParam = params.get('type');
            const floorParam = params.get('floor');

            if (regionParam) {
                document.getElementById('filterRegion').value = regionParam;
            }
            if (typeParam) {
                document.getElementById('filterType').value = typeParam;
            }
            if (floorParam) {
                document.getElementById('filterFloor').value = floorParam;
            }

            if (regionParam || typeParam || floorParam) {
                applyFilters();
            } else {
                // Initialize default view
                document.getElementById('filterCount').innerText = `검색된 매물: ${getProperties().length}개`;
                renderAllProperties();
            }
        }

        // Simple HTML Escaping for security
        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }

        // Populate floor dropdown (-6F to 30F)
        function populateFloorOptions() {
            const select = document.getElementById('filterFloor');
            select.innerHTML = '<option value="">층수</option>';
            // 지하 6층 ~ 지하 1층
            for (let i = -6; i <= -1; i++) {
                const opt = document.createElement('option');
                opt.value = `${i}층`;
                opt.innerText = `지하 ${Math.abs(i)}층`;
                select.appendChild(opt);
            }
            // 1층 ~ 30층
            for (let i = 1; i <= 30; i++) {
                const opt = document.createElement('option');
                opt.value = `${i}층`;
                opt.innerText = `${i}층`;
                select.appendChild(opt);
            }
        }

        // Run
        populateFloorOptions();
        parseUrlParameters();

        // 프리미엄 매물 상세 모달 제어 함수
        window.openPremiumDetailModal = function(propId) {
            const modal = document.getElementById('premiumDetailModal');
            const iframe = document.getElementById('premiumDetailIframe');
            if (modal && iframe) {
                iframe.src = `property-detail.html?id=${propId}`;
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        };

        window.closePremiumDetailModal = function() {
            const modal = document.getElementById('premiumDetailModal');
            const iframe = document.getElementById('premiumDetailIframe');
            if (modal && iframe) {
                modal.style.display = 'none';
                iframe.src = '';
                document.body.style.overflow = '';
            }
        };
    </script>

    <!-- 프리미엄 매물 상세 모달 팝업 컨테이너 (iframe 기반) -->
    <div id="premiumDetailModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px;">
        <div style="background: #fff; border-radius: 12px; width: 100%; max-width: 1000px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 35px rgba(0,0,0,0.3); animation: slideUp 0.3s ease-out;">
            <span onclick="closePremiumDetailModal()" style="position: absolute; top: 15px; right: 25px; font-size: 32px; color: #64748b; cursor: pointer; z-index: 10010; transition: color 0.2s;" onmouseenter="this.style.color='var(--accent-color)'" onmouseleave="this.style.color='#64748b'">&times;</span>
            <iframe id="premiumDetailIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>
    
    <style>
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</body>

</html>
